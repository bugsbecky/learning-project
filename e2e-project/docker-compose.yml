# Two programs: PostgreSQL (data) and the Java app (HTTP + SQL).
# `make` runs: docker compose up -d --build --force-recreate
#
# Host ports:
#   8080  → the website and /api/todos
#   5433  → PostgreSQL (5433 on your machine, 5432 inside Docker)

name: e2e-todo

services:
  db:
    image: postgres:16-alpine
    container_name: e2e-todo-db
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5433:5432"
    volumes:
      - e2e-todo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: ./backend
    container_name: e2e-todo-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/todo
      SPRING_DATASOURCE_USERNAME: todo
      SPRING_DATASOURCE_PASSWORD: todo
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/frontend/
    volumes:
      - ./frontend:/frontend:ro

volumes:
  e2e-todo-data:
