# ---------------------------------------------------------------------------
# How this Java app finds PostgreSQL and the HTML/CSS/JS files.
# Lines starting with # are comments. Spring ignores them.
# ---------------------------------------------------------------------------

# JDBC = Java Database Connectivity. This URL is: host + port + database name.
# Port 5433 is the *host* port from docker-compose.yml (inside Docker it is 5432).
spring.datasource.url=jdbc:postgresql://localhost:5433/todo
spring.datasource.username=todo
spring.datasource.password=todo

# Run schema.sql every time the app starts.
# That file uses CREATE TABLE IF NOT EXISTS, so existing todos are kept.
spring.sql.init.mode=always

# Print the SQL that JdbcTemplate sends. Watch `make logs` while you click the UI.
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# Serve the beginner frontend (HTML/CSS/JS) from the sibling frontend/ folder.
# The Makefile overrides this with an absolute path so it always works.
spring.web.resources.static-locations=file:../frontend/

# Keep JSON timestamps readable (ISO-8601), e.g. 2026-08-30T12:00:00Z
spring.jackson.serialization.write-dates-as-timestamps=false
